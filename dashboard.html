<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Talent Optimization Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: #090d16; color: #f1f5f9; padding: 30px; }
        
        .dashboard-container { max-width: 1200px; margin: 0 auto; }
        
        .db-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 30px; }
        .db-title h1 { font-size: 24px; color: #38bdf8; letter-spacing: -0.5px; }
        .db-title p { color: #64748b; font-size: 13px; margin-top: 4px; }
        
        .control-row { background: #111827; padding: 16px; border-radius: 8px; border: 1px solid #1e293b; margin-bottom: 25px; display: flex; align-items: center; gap: 15px; }
        .control-row label { font-size: 13px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .filter-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #38bdf8; color: #090d16; border-color: #38bdf8; font-weight: 600; }

        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        
        .card { background: #111827; border: 1px solid #1e293b; border-radius: 10px; padding: 24px; }
        .card-title { font-size: 15px; font-weight: 600; color: #f1f5f9; margin-bottom: 15px; border-left: 3px solid #38bdf8; padding-left: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .resource-list { display: flex; flex-direction: column; gap: 15px; }
        .resource-item { background: #1f2937; border: 1px solid #374151; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .profile-meta h3 { font-size: 16px; color: #fff; }
        .profile-meta p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        
        .metric-badge { background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .workload-indicator { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; }
        .load-optimal { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .load-critical { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        
        .stat-box { background: #1f2937; padding: 15px; border-radius: 6px; border: 1px solid #374151; margin-bottom: 15px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        .stat-lbl { font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="db-header">
            <div class="db-title">
                <h1>Resource Allocation & Performance Engine</h1>
                <p>Enterprise structural execution model for tracking operational workload capabilities</p>
            </div>
            <div class="metric-badge" style="font-size: 14px; padding: 8px 16px;">System State: Active</div>
        </div>

        <div class="control-row">
            <label>Filter Talent Domain Matrix:</label>
            <button class="filter-btn active" onclick="filterTalentGrid('all', this)">All Sectors</button>
            <button class="filter-btn" onclick="filterTalentGrid('frontend', this)">Frontend Layer</button>
            <button class="filter-btn" onclick="filterTalentGrid('logic', this)">Logic Frameworks</button>
        </div>
        <div class="main-grid">
            <div class="card">
                <div class="card-title">Monitored Personnel Allocations</div>
                <div id="resourceGridCanvas" class="resource-list">
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 25px;">
                <div class="card">
                    <div class="card-title">System Metrics Summary</div>
                    <div class="stat-box">
                        <div class="stat-val" id="totalCount">3 Active</div>
                        <div class="stat-lbl">Monitored Profiles</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" style="color: #4ade80;">94.2%</div>
                        <div class="stat-lbl">Resource Optimization Index</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
